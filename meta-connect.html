<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect Facebook — Sandy Bay Caravan Park</title>
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
       background:#F5F1E8;color:#16262E;display:flex;min-height:100vh;
       align-items:center;justify-content:center;padding:20px;}
  .card{background:#fff;border-radius:14px;padding:34px 30px;max-width:560px;width:100%;
        box-shadow:0 2px 20px rgba(22,38,46,0.10);}
  h1{margin:0 0 6px;font-size:23px;}
  p{font-size:15.5px;line-height:1.6;color:#3A4448;}
  .code{font-family:'Courier New',monospace;font-size:15px;background:#F5F1E8;
        border:1px solid #DED8CA;border-radius:8px;padding:15px;word-break:break-all;
        margin:16px 0;user-select:all;}
  button{background:#16262E;color:#F5F1E8;border:none;border-radius:8px;
         padding:13px 22px;font-size:15px;font-weight:600;cursor:pointer;}
  button:active{opacity:0.85;}
  .ok{color:#3F8478;font-weight:600;font-size:14px;margin-left:10px;}
  .bad{background:#FDF3EC;border:1px solid #E8C9B0;border-radius:8px;
       padding:14px 16px;color:#8A5A2B;font-size:15px;}
  ol{font-size:15.5px;line-height:1.7;color:#3A4448;padding-left:22px;}
</style>
</head>
<body>
  <div class="card" id="card">
    <h1>Connecting Facebook</h1>
    <div id="out"></div>
  </div>
<script>
(function(){
  var p = new URLSearchParams(window.location.search);
  var code = p.get('code');
  var err = p.get('error_description') || p.get('error');
  var out = document.getElementById('out');

  if (err) {
    out.innerHTML = '<div class="bad"><b>Facebook didn\'t finish.</b><br>' +
      String(err).replace(/[<>&]/g,'') + '</div>' +
      '<p>Go back to AI Ray and press <b>Connect Facebook</b> to try again.</p>';
    return;
  }
  if (!code) {
    out.innerHTML = '<p>This page is only used while connecting Facebook to AI Ray. ' +
      'There is nothing to do here.</p>' +
      '<p><a href="/">Back to Sandy Bay Caravan Park</a></p>';
    return;
  }

  out.innerHTML =
    '<p>That worked. Here is your code — copy it, then paste it into the box in AI Ray.</p>' +
    '<div class="code" id="code">' + code.replace(/[<>&"]/g,'') + '</div>' +
    '<button id="copy">Copy the code</button><span class="ok" id="done"></span>' +
    '<ol style="margin-top:22px;">' +
      '<li>Go back to AI Ray on the office computer.</li>' +
      '<li>Paste it into the box that says <b>Paste the code from Facebook</b>.</li>' +
      '<li>Press <b>Finish connecting</b>.</li>' +
    '</ol>' +
    '<p style="font-size:13.5px;color:#7A8A8E;">This code only works once, and only for a few minutes. ' +
    'If it stops working, just press Connect Facebook in AI Ray again.</p>';

  document.getElementById('copy').addEventListener('click', function(){
    var t = document.getElementById('code').textContent;
    function ok(){ document.getElementById('done').textContent = 'Copied'; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(ok, function(){
        var r=document.createRange(); r.selectNode(document.getElementById('code'));
        window.getSelection().removeAllRanges(); window.getSelection().addRange(r); ok();
      });
    } else {
      var r=document.createRange(); r.selectNode(document.getElementById('code'));
      window.getSelection().removeAllRanges(); window.getSelection().addRange(r); ok();
    }
  });
})();
</script>
</body>
</html>
