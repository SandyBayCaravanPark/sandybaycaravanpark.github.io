name: Regenerate email banner

# Runs automatically whenever AI Ray pushes an update that touches the
# for-sale caravan data, and rebuilds images/email-banner.png to match.
# Also runnable by hand from the Actions tab if you ever want to force it.
on:
  push:
    branches: [main]
    paths:
      - "data/caravans.json"
      - "images/logo.png"
      - "scripts/generate-email-banner.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  regenerate-banner:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate banner
        run: python3 scripts/generate-email-banner.py

      - name: Commit updated banner if it changed
        run: |
          git config user.name "sandy-bay-bot"
          git config user.email "actions@users.noreply.github.com"
          git add images/email-banner.png
          git diff --cached --quiet || git commit -m "Auto-update email banner [skip ci]"
          git push
